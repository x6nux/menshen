    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>门神配置</title>

  <body>
    <div id="root"></div>
    <!-- 官方 SDK 自托管：telegram.org 在部分网络不可达，不能依赖外链加载。

         telegram.ts 仍保留轮询兜底。 -->
    <script src="%BASE_URL%telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
