# menshen 配置。复制为 config.yaml 后按需修改。
# 这里只有接入 Telegram 必需的几项，其余全部在 bot 的管理面板里配置。
#
# ---- 每一项都可以改用环境变量 ----
#
# 键名加 MENSHEN_ 前缀、转大写即可：
#
#   admin_ids    → MENSHEN_ADMIN_IDS    （多个用逗号分隔："1,2,3"）
#   bot_token    → MENSHEN_BOT_TOKEN
#   public_url   → MENSHEN_PUBLIC_URL
#   listen_addr  → MENSHEN_LISTEN_ADDR
#   tg_api_base  → MENSHEN_TG_API_BASE
#   tg_proxy     → MENSHEN_TG_PROXY
#   ai_proxy     → MENSHEN_AI_PROXY
#   db_path      → MENSHEN_DB_PATH
#
# 环境变量**优先于**本文件，且本文件可以完全不存在（容器里常见的做法是
# 不挂配置、全用环境变量）。两者混用时，本文件提供基线、环境变量覆盖个别项。
#
# 前缀用于避免与既有环境变量冲突，例如 HTTP_PROXY 由 Go 自身使用。

# ---- 主管理员（必填）----
# TG 数字 user_id，不是用户名。
#
# 主管理员掌握上游渠道、模型与联合封禁，并可在面板上添加**次级管理员**。
# 次管只能接入自己的 bot，并管理这些 bot 在各群的行为。
#
# 该名单只存在于配置文件、不落库，面板无法删除，
# 以避免整个服务失去所有管理员。
admin_ids:
  - 123456789

# ---- 主 bot（必填）----
# 管理面板所在的 bot，**只做配置管理与接入其他 bot**：
# 不入群、不判定广告，被拉进群或频道会自动退出。实际参与群内判定的是
# 在面板接入的工作 bot。
#
# 它同时是长轮询模式下唯一工作的 bot，因此长轮询只能做配置管理，
# 要判定必须配 public_url 切到 webhook 模式。
bot_token: "123456789:AA..."

# ---- 接入方式：填了 public_url 就是 webhook，否则是长轮询 ----
#
# ⚠️ 要接入**多个** bot 必须填 public_url。长轮询模式只服务主 bot，
#    管理员在面板接入子 bot 会被直接拒绝 —— getUpdates 需为每个 bot
#    各开一条长连接，而 Telegram 的限速同时按 bot 和按出口 IP 计，
#    多个 bot 并行轮询会相互挤占配额，导致整体变慢、丢更新。

# public_url 是回调地址的**前缀**，可以带任意层子路径。
# 完整回调地址 = <public_url>/<bot_token>/webhook
#
# 每个已接入的 bot 由本进程自动 setWebhook，不必手工调用。
# 路径里的 token 就是凭证，与 Telegram 官方的 /bot<TOKEN>/method 同构。
#
# ⚠️ 接入是**注册制**：token 必须先由某个管理员在面板上登记
#    （🤖 我的机器人 → 添加），未登记的一律 401；bot 需有归属，
#    才能确定其管理者与开销承担者。
#
# 必须是 https（Telegram 不接受 http），通常是反代对外的地址。
# public_url: "https://ad.example.com"

# webhook 模式下本进程的监听地址。默认只监听回环——
# 该端口上的请求等同于以 bot 身份收发消息，不要直接暴露到公网，
# 前面挂 nginx / caddy 做 TLS 终止。
#
# ⚠️ 跑在容器里时必须改成 "0.0.0.0:8081"：默认值只监听容器自身的回环，
#    端口映射过去也连不上。暴露面交给 compose 的端口绑定来收敛。
# listen_addr: "127.0.0.1:8081"

# ---- 可选 ----

# Bot API 基址。默认走反代，因为直连 api.telegram.org 在不少网络环境下
# 连 TCP 都无法建立，而它是整个 bot 唯一的输入通道。
# tg_api_base: "https://api.telegram.org"

# 出网代理，两类请求分开配，都可留空。
#
#   tg_proxy  Telegram Bot API
#   ai_proxy  AI 上游（全部渠道）
#
# 分开配是因为常见形态为 Telegram 直连受限、AI 走中转，为 AI 流量也套代理
# 只会额外增加一跳延迟。只需其中一个时只配一个即可。
#
# 留空 = 沿用 HTTP_PROXY / HTTPS_PROXY 环境变量（不是直连）。
#
# ⚠️ 必须带协议前缀，且漏写时不一定报错：
#    形如 "主机:端口" 的地址启动时会被明确拒绝，但纯主机名形式能解析过去
#    —— Go 会把主机名当成协议名，结果连不上也不报错。本服务两类都拦。
#    可用 http / https / socks5 / socks5h。
#
# ⚠️ 跑在容器里时回环地址指的是容器自身。要用宿主机上的代理须写宿主机
#    可达的地址（Docker Desktop 为 host.docker.internal，Linux 下为宿主机
#    在 docker0 上的地址）。
#
# MTProto 客户端应用标识（my.telegram.org 申请）。只用于入群时间回查 ——
# 用 bot 自己的 token 登录 MTProto 读取成员记录的 date。
# 不配则用内置的公开 Telegram Desktop 值（2040 / b18441a1…），默认可用；
# 建议换成自己申请的值：共用公开值会被限流。
# 想关掉这一项（不发起任何 MTProto 连接）：tg_api_id: 0
# tg_api_id: 2040
# tg_api_hash: ""

# 代理和 tg_api_base 解决的不是同一件事：后者换的是目标地址（反代），
# 前者换的是到达路径。多数情况下用默认的反代就够，不必配代理。
# tg_proxy: "http://127.0.0.1:7890"
# ai_proxy: ""

# SQLite 数据库路径。库里有上游 api_key 明文，建议 0600 权限。
# ⚠️ 跑在容器里时必须指向挂载卷内的路径，
#    否则写进容器可写层，重启即全部丢失。
# db_path: "data.db"
#
# 运行日志文件也落在数据库同目录（data.db → data.log，写满滚成 .1 备份），
# 单文件与总大小上限（MB）在网页全局设置 → 护栏与成本处调整，
# 0 = 关闭文件日志 —— 这里没有对应配置项，不用改本文件。

# ---- 申诉网页（仅 webhook 模式）----
#
# 被处罚的人可以在私聊里发起申诉；AI 维持原判时走网页人机验证
# （Cloudflare Turnstile），通过后签发解禁码由管理员兑换。
#
# 不配 Turnstile 密钥也能跑：申诉在 AI 这一步维持原判后会降级为
# 提示联系群管理员，只是没有网页验证与解禁码。
#
# ⚠️ Turnstile 后台的域名白名单必须包含 public_url 的主机名，
#    否则验证组件无法在页面加载，申诉会卡在网页验证这一步。
# turnstile_site_key: ""
# turnstile_secret: ""

# ---- 入群人机验证 ----
#
# 新人进群先禁言，网页上通过人机验证后自动解除；未通过则按等待时长
# 移出群聊。**全部在网页面板上配置**（bot 私聊菜单 → 全局设置，或
# Mini App / 网页版 /admin 的入群人机验证卡片），存 settings 表，
# 不在 config.yaml：
#
#   captcha_provider   turnstile | hcaptcha | cap（cap 内置，无需密钥）
#   captcha_site_key   turnstile / hcaptcha 的站点密钥
#   captcha_secret     与 site key 配对的服务端密钥
#   captcha_min_score  分数下限（仅 hCaptcha Enterprise 有意义）
#   captcha_demo       人机验证测试台（_w/demo）开关，仅测试用
#   captcha_demo_keys  测试台里各家的密钥
#
# per-bot 的开关（antiad_joinverify / antiad_joinverify_minutes）在
# 面板的进群与验证分组里。

# 取客户端真实 IP 的请求头（用于网页验证记录与账号关联）。
# 前提：listen_addr 只绑回环、流量全部经过反代，这个头才可信。
# Cloudflare 后面填 "CF-Connecting-IP"，nginx 后面填 "X-Real-IP"。
# client_ip_header: ""
