# menshen 配置。复制为 config.yaml 后按需修改。
# 这里只有接入 Telegram 必需的几项，其余全部在 bot 的管理面板里配置。
#
# ---- 每一项都可以改用环境变量 ----
#
# 键名加 MENSHEN_ 前缀、转大写即可：
#
#   admin_ids    → MENSHEN_ADMIN_IDS    （多个用逗号分隔："1,2,3"）
#   bot_token    → MENSHEN_BOT_TOKEN
#   public_url   → MENSHEN_PUBLIC_URL
#   listen_addr  → MENSHEN_LISTEN_ADDR
#   tg_api_base  → MENSHEN_TG_API_BASE
#   tg_proxy     → MENSHEN_TG_PROXY
#   ai_proxy     → MENSHEN_AI_PROXY
#   db_path      → MENSHEN_DB_PATH
#
# 环境变量**压过**本文件，且本文件可以完全不存在（容器里常见的做法是
# 不挂配置、全用环境变量）。两者混用时，本文件给基线、环境变量覆盖个别项。
#
# 加前缀是为了不跟别的东西撞车 —— 尤其 HTTP_PROXY 已经被 Go 自己用着了。

# ---- 主管理员（必填）----
# TG 数字 user_id，不是用户名。
#
# 主管理员掌握上游渠道、模型与联合封禁，并可在面板上添加**次级管理员**。
# 次管只能接入自己的 bot、管自己那些 bot 在各群的行为。
#
# 这份名单只存在于配置文件里，不进数据库 —— 面板上删不掉它，
# 否则一次手滑就能让整个服务没有任何人能管。
admin_ids:
  - 123456789

# ---- 主 bot（必填）----
# 管理面板所在的那个 bot，**只做配置管理与接入其他 bot**：
# 不入群、不判定广告，被拉进群或频道会自动退出。群里干活的是在面板上
# 接入的工作 bot。
#
# 它同时也是长轮询模式下唯一工作的 bot —— 因此长轮询只能做配置管理，
# 要判定必须配 public_url 切到 webhook 模式。
bot_token: "123456789:AA..."

# ---- 接入方式：填了 public_url 就是 webhook，否则是长轮询 ----
#
# ⚠️ 要接入**多个** bot 就必须填 public_url。长轮询模式下只能服务上面那
#    一个 bot，管理员在面板上接入子 bot 会被直接拒绝 —— getUpdates 要为
#    每个 bot 各开一条长连接，而 Telegram 的限速同时按 bot 和按出口 IP
#    算，几个 bot 一起轮询会互相挤掉配额，表现是全都变慢、全都丢更新。

# public_url 是回调地址的**前缀**，可以带任意层子路径。
# 完整回调地址 = <public_url>/<bot_token>/webhook
#
#   public_url: "https://ad.example.com/tg"
#   → https://ad.example.com/tg/123456789:AA.../webhook
#
# 每个已接入的 bot 由本进程自动 setWebhook，不必手工调用。
# 路径里的 token 就是凭证，与 Telegram 官方的 /bot<TOKEN>/method 同构。
#
# ⚠️ 接入是**注册制**：token 必须先由某个管理员在面板上登记过
#    （🤖 我的机器人 → 添加），没登记的一律 401。没有归属就谈不上
#    谁能管它、谁为它的开销负责。
#
# 必须是 https（Telegram 不接受 http），通常是反代对外的地址。
# public_url: "https://ad.example.com"

# webhook 模式下本进程的监听地址。默认只听回环——
# 这个端口上的请求等同于「以 bot 身份收发消息」，不要直接暴露到公网，
# 前面挂 nginx / caddy 做 TLS 终止。
#
# ⚠️ 跑在容器里时必须改成 "0.0.0.0:8081"：默认值只听容器自己的回环，
#    端口映射过去也连不上。暴露面交给 compose 的端口绑定来收敛。
# listen_addr: "127.0.0.1:8081"

# ---- 可选 ----

# Bot API 基址。默认走反代，因为直连 api.telegram.org 在不少网络环境下
# 连 TCP 都握不上手，而那是整个 bot 唯一的输入通道。
# tg_api_base: "https://api.telegram.org"

# 出网代理，两类请求分开配，都可留空。
#
#   tg_proxy  Telegram Bot API
#   ai_proxy  AI 上游（全部渠道）
#
# 分开配是因为最常见的形态是「TG 被墙、AI 走国内中转」—— 把 AI 流量也
# 绕一圈只是白多一跳延迟。只需要其中一个就只配一个。
#
# 留空 = 沿用 HTTP_PROXY / HTTPS_PROXY 环境变量（不是直连）。
# 换句话说现在靠环境变量跑着的部署，不动这两项即可保持原样。
#
# ⚠️ 必须带协议前缀，而且漏写时不一定会报错：
#    "127.0.0.1:7890" 启动时会被明确拒绝，但 "localhost:1080" 这种主机名
#    形式解析得过去 —— Go 会把 "localhost" 当成协议名，结果是连不上也不
#    报错。本服务两类都拦。可用 http / https / socks5 / socks5h。
#
# ⚠️ 跑在容器里时 127.0.0.1 指的是容器自己。要用宿主机上的代理得写
#    "http://host.docker.internal:7890"（Docker Desktop）或宿主机在
#    docker0 上的地址（Linux 常见为 172.17.0.1）。
#
# MTProto 客户端应用标识（my.telegram.org 申请）。只用于「入群时间」回查 ——
# 用 bot 自己的 token 登录 MTProto 读成员记录的 date。
# 不配则用内置的公开 Telegram Desktop 值（2040 / b18441a1…），开箱可用；
# 建议换成自己申请的（免费，共用公开值会被限流）。
# 想关掉这一项（不发起任何 MTProto 连接）：tg_api_id: 0
# tg_api_id: 2040
# tg_api_hash: ""

# 代理和 tg_api_base 解决的不是同一件事：后者换的是目标地址（反代），
# 前者换的是到达路径。多数情况下用默认的反代就够，不必配代理。
# tg_proxy: "http://127.0.0.1:7890"
# ai_proxy: ""

# SQLite 数据库路径。库里有上游 api_key 明文，建议 0600 权限。
# ⚠️ 跑在容器里时必须指向挂载卷内（如 "/app/data/data.db"），
#    否则写进容器可写层，重启即全部丢失。
# db_path: "data.db"
#
# 运行日志文件也落在数据库同目录（data.db → data.log，写满滚成 .1 备份），
# 单文件与总大小上限（MB）在网页「全局设置 → 护栏与成本」调整，
# 0 = 关闭文件日志 —— 这里没有对应配置项，不用改本文件。

# ---- 申诉网页（仅 webhook 模式）----
#
# 被处罚的人可以在私聊里发起申诉；AI 维持原判时走网页人机验证
# （Cloudflare Turnstile），通过后签发解禁码由管理员兑换。
#
# 不配 Turnstile 密钥也能跑：申诉在 AI 这一步维持原判后会降级成
# 「请联系群管理员」，只是没有网页验证与解禁码。
#
# ⚠️ Turnstile 后台的域名白名单必须包含 public_url 的主机名，
#    否则验证组件在页面上根本加载不出来，所有申诉都卡在网页这一步。
# turnstile_site_key: ""
# turnstile_secret: ""

# ---- 入群人机验证（仅 webhook 模式）----
#
# 新人进群先禁言，网页上通过人机验证后自动解除；未通过则按等待时长
# 移出群聊。开关在面板的「进群与验证」里（antiad_joinverify，per-bot），
# 这里配的是用哪家的验证码：
#
#   captcha_provider: turnstile | hcaptcha | cap
#     - turnstile  → Cloudflare Turnstile（与申诉用的那套密钥**不同**，
#                    这里用 captcha_secret，申诉用 turnstile_secret）
#     - hcaptcha   → hCaptcha
#     - cap        → 内置实现（Go 进程内，见 antiad/capserver.go）。
#                    **无需任何配置、无需单独跑服务**，直接写 cap 即可。
#
# 留空 = 不启用入群验证（面板上的开关即使打开也不生效）。
# turnstile / hcaptcha 需要 captcha_site_key + captcha_secret；
# captcha_min_score（0-100，0 = 不检查）只对 hCaptcha Enterprise 有意义，
# 普通 hCaptcha 不返回分数。
#
# ⚠️ 各家的域名白名单同样要包含 public_url 的主机名。
# captcha_provider: ""
# captcha_site_key: ""
# captcha_secret: ""
# captcha_min_score: 0

# ---- 人机验证测试台（_w/demo，仅测试用）----
#
# 打开后访问 <public_url>/_w/demo/1/x 可在一页里逐个测试各验证方式。
# 生产环境保持 captcha_demo: 0。cap 是内置的，无需在此配密钥即会出现。
#
# captcha_demo: 0
# captcha_demo_keys: "turnstile=site_key,secret;hcaptcha=site_key,secret"

# 取客户端真实 IP 的请求头（用于网页验证记录与账号关联）。
# 前提：listen_addr 只绑回环、流量全部经过反代，这个头才可信。
# Cloudflare 后面填 "CF-Connecting-IP"，nginx 后面填 "X-Real-IP"。
# client_ip_header: ""
